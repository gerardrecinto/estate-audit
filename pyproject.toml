[project]
name = "estate-audit"
version = "0.1.0"
description = "Audit a mixed Linux and Windows server estate: patch age, certificate expiry, SAN and NAS volume forecasts, LDAP account hygiene, and a tamper-evident maintenance log."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
estate-audit = "estate_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
